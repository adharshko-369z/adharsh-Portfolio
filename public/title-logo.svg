<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="#0B0F1A"/>

  <!-- Syntax Code Group: "</>" -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Angle Bracket "<" (#5B8CFF) -->
    <path d="M 160 176 L 80 256 L 160 336" fill="none" stroke="#5B8CFF" stroke-width="36"/>

    <!-- Forward Slash "/" (#E8ECF5) -->
    <path d="M 288 144 L 224 368" fill="none" stroke="#E8ECF5" stroke-width="36"/>

    <!-- Right Angle Bracket ">" (#5B8CFF) -->
